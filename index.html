<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Screening — Sentiment Classifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16131a;
    --bg-deep: #0f0d12;
    --card: #201b26;
    --card-line: #34303c;
    --gold: #d7ab52;
    --gold-dim: #8a723f;
    --ink: #ece7de;
    --ink-dim: #a39c8f;
    --acclaimed: #6fa282;
    --panned: #b0475a;
    --focus: #e8c877;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    background:
      radial-gradient(ellipse at top, #241f2c 0%, var(--bg) 55%, var(--bg-deep) 100%);
    font-family: 'Libre Franklin', sans-serif;
    color: var(--ink);
  }

  .marquee {
    position: relative;
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 6px;
    padding: 40px 36px 36px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(215,171,82,0.06);
  }

  /* marquee bulb strip */
  .bulbs {
    position: absolute;
    top: -13px;
    left: 18px;
    right: 18px;
    display: flex;
    justify-content: space-between;
  }
  .bulb {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold-dim);
    box-shadow: 0 0 4px rgba(215,171,82,0.3);
    animation: flicker 3.2s ease-in-out infinite;
  }
  .bulb:nth-child(odd) { animation-delay: 0.4s; }
  .bulb:nth-child(3n) { animation-delay: 1.1s; }
  .bulb:nth-child(5n) { animation-delay: 1.8s; }
  @keyframes flicker {
    0%, 100% { background: var(--gold-dim); box-shadow: 0 0 4px rgba(215,171,82,0.25); }
    50% { background: var(--gold); box-shadow: 0 0 10px rgba(215,171,82,0.85); }
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 6px;
    font-weight: 600;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 0.02em;
    line-height: 1;
    margin: 0 0 4px;
    color: var(--ink);
  }

  .subtitle {
    font-size: 14px;
    color: var(--ink-dim);
    margin: 0 0 28px;
  }

  label.field-label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    background: var(--bg-deep);
    border: 1px solid var(--card-line);
    border-radius: 4px;
    color: var(--ink);
    font-family: 'Libre Franklin', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    padding: 12px 14px;
    transition: border-color 0.15s ease;
  }
  textarea::placeholder { color: #625b6a; }
  textarea:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(215,171,82,0.15);
  }

  button {
    margin-top: 16px;
    width: 100%;
    padding: 13px 16px;
    background: var(--gold);
    color: #201b26;
    border: none;
    border-radius: 4px;
    font-family: 'Libre Franklin', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:hover { background: #e6bd66; }
  button:active { transform: scale(0.98); }
  button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  button:disabled {
    opacity: 0.55;
    cursor: default;
  }

  /* result / gauge */
  .result-wrap {
    margin-top: 30px;
    display: none;
  }
  .result-wrap.show { display: block; }

  .verdict-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .verdict {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.03em;
  }
  .verdict.acclaimed { color: var(--acclaimed); }
  .verdict.panned { color: var(--panned); }

  .confidence-num {
    font-size: 13px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .gauge-track {
    position: relative;
    height: 8px;
    border-radius: 4px;
    background: var(--bg-deep);
    border: 1px solid var(--card-line);
    overflow: hidden;
  }
  .gauge-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    transition: width 0.7s cubic-bezier(.2,.8,.2,1);
  }
  .gauge-fill.acclaimed { background: linear-gradient(90deg, #4d7d63, var(--acclaimed)); }
  .gauge-fill.panned { background: linear-gradient(90deg, #7d3140, var(--panned)); }

  .scale-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b6474;
  }

  .error-text {
    margin-top: 14px;
    font-size: 13px;
    color: var(--panned);
    display: none;
  }
  .error-text.show { display: block; }
</style>
</head>
<body>

<div class="marquee">
  <div class="bulbs">
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span>
  </div>

  <p class="eyebrow">Now Screening</p>
  <h1>Review Verdict</h1>
  <p class="subtitle">Paste a movie review below and let the model deliver its opinion.</p>

  <label class="field-label" for="reviewText">Review text</label>
  <textarea id="reviewText" placeholder="&ldquo;A masterclass in pacing, though the third act stumbles...&rdquo;"></textarea>
  <button id="predictBtn" onclick="predict()">Read the Room</button>

  <p class="error-text" id="errorText">Couldn't reach the projection booth — try again.</p>

  <div class="result-wrap" id="resultWrap">
    <div class="verdict-row">
      <span class="verdict" id="verdictText"></span>
      <span class="confidence-num" id="confidenceNum"></span>
    </div>
    <div class="gauge-track">
      <div class="gauge-fill" id="gaugeFill"></div>
    </div>
    <div class="scale-labels">
      <span>Panned</span>
      <span>Acclaimed</span>
    </div>
  </div>
</div>

<script>
async function predict() {
  const text = document.getElementById("reviewText").value;
  const btn = document.getElementById("predictBtn");
  const errorText = document.getElementById("errorText");
  const resultWrap = document.getElementById("resultWrap");

  if (!text.trim()) return;

  errorText.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Screening…";

  try {
    const response = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ review: text })
    });

    if (!response.ok) throw new Error("Request failed");

    const data = await response.json();
    const isPositive = /pos|good|acclaim/i.test(data.answer);
    const pct = (data.confidence * 100).toFixed(1);

    const verdictText = document.getElementById("verdictText");
    const gaugeFill = document.getElementById("gaugeFill");

    verdictText.textContent = data.answer;
    verdictText.className = "verdict " + (isPositive ? "acclaimed" : "panned");

    document.getElementById("confidenceNum").textContent = pct + "% confident";

    gaugeFill.className = "gauge-fill " + (isPositive ? "acclaimed" : "panned");
    gaugeFill.style.width = "0%";
    requestAnimationFrame(() => {
      gaugeFill.style.width = pct + "%";
    });

    resultWrap.classList.add("show");
  } catch (err) {
    errorText.classList.add("show");
    resultWrap.classList.remove("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "Read the Room";
  }
}
</script>

</body>
</html>
