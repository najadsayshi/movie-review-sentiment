<!DOCTYPE html>
<html>
<head>
  <title>Sentiment Classifier</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; }
    textarea { width: 100%; height: 120px; }
    button { margin-top: 10px; padding: 8px 16px; }
    #result { margin-top: 20px; font-size: 1.2em; }
  </style>
</head>
<body>
  <h1>Movie Review Sentiment</h1>
  <textarea id="reviewText" placeholder="Type a review..."></textarea>
  <button onclick="predict()">Predict</button>
  <div id="result"></div>

  <script>
    async function predict() {
      const text = document.getElementById("reviewText").value;

      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ review: text })
      });

      const data = await response.json();

      document.getElementById("result").innerText =
        data.answer + " (" + (data.confidence * 100).toFixed(1) + "% confident)";
    }
  </script>
</body>
</html>
